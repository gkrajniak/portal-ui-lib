name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    uses: platform-mesh/.github/.github/workflows/job-tag-version.yml@3bfaea3b0850978a4cbca35206a41e54084fb3a1
    permissions:
      contents: read

  build:
    needs: [version]
    uses: platform-mesh/.github/.github/workflows/job-node-test.yml@3bfaea3b0850978a4cbca35206a41e54084fb3a1
    secrets: inherit # zizmor: ignore[secrets-inherit]

  publish:
    needs: [version, build]
    uses: platform-mesh/.github/.github/workflows/job-node-publish.yml@3bfaea3b0850978a4cbca35206a41e54084fb3a1
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read
      id-token: write # Needed for npm provenance via OIDC when publishing
    with:
      version: ${{ needs.version.outputs.version }}
      distTag: ${{ needs.version.outputs.distTag }}
      publishFromDist: true
      commitVersion: false
      environment: npmjs:@platform-mesh/portal-ui-lib

  github-release:
    needs: [version, publish]
    uses: platform-mesh/.github/.github/workflows/job-github-release.yml@3bfaea3b0850978a4cbca35206a41e54084fb3a1
    permissions:
      contents: write # Needed to create the GitHub release
    with:
      tag: ${{ needs.version.outputs.tag }}
      previousTag: ${{ needs.version.outputs.previousTag }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
      latest: ${{ needs.version.outputs.latest == 'true' }}
