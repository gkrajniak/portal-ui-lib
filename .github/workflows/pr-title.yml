name: pr-title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    uses: platform-mesh/.github/.github/workflows/job-pr-title.yml@dcc1039ea425e209cae9a6aa2339f71798406724
    permissions:
      pull-requests: read # Needed to read the pull request title
