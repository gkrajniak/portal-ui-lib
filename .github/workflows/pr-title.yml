name: pr-title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    uses: platform-mesh/.github/.github/workflows/job-pr-title.yml@2baf2ece1faa3b2f54670e25655c5d2e608d7794
