name: pr-title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    uses: platform-mesh/.github/.github/workflows/job-pr-title.yml@4c74c1cdaa4813c703921a66d6751f2c3f3116a6
    permissions:
      pull-requests: read
